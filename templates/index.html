<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 50px; }
        input { width: 60%; padding: 10px; margin-top: 10px; }
        button { padding: 10px; cursor: pointer; }
        #chatbox { margin-top: 20px; text-align: left; max-width: 600px; margin: auto; }
    </style>
</head>
<body>
    <h1>Groq Chatbot</h1>
    <div id="chatbox"></div>
    <input type="text" id="userInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            let message = document.getElementById("userInput").value;
            document.getElementById("chatbox").innerHTML += "<p><b>You:</b> " + message + "</p>";
            document.getElementById("userInput").value = "";

            let response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message })
            });

            let result = await response.json();

            // Ensure the correct field is displayed
            let botMessage = result.response || "Error: No response from API";
            document.getElementById("chatbox").innerHTML += "<p><b>Groq:</b> " + botMessage + "</p>";
        }
    </script>
</body>
</html>
